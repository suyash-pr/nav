[project]
name = "nav"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suyash-pr", email = "suyash@paddington-robotics.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "ipykernel>=7.3.0",
    "lightning>=2.6.6",
    "mypy>=2.3.1",
    "pandas>=2.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "scipy>=1.17.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
nav = "nav:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
